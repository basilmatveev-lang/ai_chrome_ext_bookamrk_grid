<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bookmarks Grid Settings</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      .option-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .option-group label {
        font-weight: bold;
      }
      .radio-group {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .save-btn {
        padding: 10px 20px;
        cursor: pointer;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Bookmarks Display Settings</h1>

    <div class="option-group">
      <label for="columns">Number of columns (2-16):</label>
      <input type="number" id="columns" min="2" max="16" value="4" />
    </div>

    <div class="option-group">
      <label for="fontFamily">Font:</label>
      <select id="fontFamily">
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">
          Segoe UI
        </option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Courier New', Courier, monospace">Courier New</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="Verdana, Geneva, sans-serif">Verdana</option>
      </select>
    </div>

    <div class="option-group">
      <label for="fontSize">Font size (px):</label>
      <input type="number" id="fontSize" min="8" max="32" value="14" />
    </div>

    <div class="option-group">
      <label>Link opening method:</label>
      <div class="radio-group">
        <label
          ><input type="radio" name="openMethod" value="_blank" /> New
          window</label
        >
        <label
          ><input type="radio" name="openMethod" value="_self" /> Same
          window</label
        >
      </div>
    </div>

    <div class="option-group">
      <label>Cell alignment:</label>
      <div class="radio-group">
        <label
          ><input type="radio" name="cellAlignment" value="start" /> Fit
          content</label
        >
        <label
          ><input type="radio" name="cellAlignment" value="stretch" /> Stretch
          to fill height</label
        >
      </div>
    </div>

    <div class="option-group">
      <label>Color theme:</label>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light" /> Light</label>
        <label><input type="radio" name="theme" value="dark" /> Dark</label>
      </div>
    </div>

    <div class="option-group">
      <label>Cell frame style:</label>
      <div class="radio-group">
        <label
          ><input type="radio" name="cellStyle" value="rounded" /> Rounded
          corners</label
        >
        <label
          ><input type="radio" name="cellStyle" value="square" /> Square
          corners</label
        >
      </div>
    </div>

    <button id="save" class="save-btn">Save settings</button>

    <script src="options.js"></script>
  </body>
</html>
